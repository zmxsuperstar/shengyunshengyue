<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 声韵 · 声乐AI教学助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep:#0a0a1a;--bg-mid:#111128;--bg-card:#1a1a3e;--bg-card-hover:#222255;
  --surface:rgba(26,26,62,0.85);--surface-glass:rgba(26,26,62,0.55);
  --accent-gold:#d4a853;--accent-gold-dim:#b8923f;--accent-gold-glow:rgba(212,168,83,0.3);
  --accent-purple:#7c5cbf;--accent-purple-dim:#5a3d96;
  --accent-blue:#4a7fd4;
  --text-primary:#e8e4f0;--text-secondary:#9a96b8;--text-muted:#6b6888;
  --user-bubble:linear-gradient(135deg,#4a7fd4,#7c5cbf);
  --ai-bubble:rgba(30,30,65,0.9);
  --border-subtle:rgba(124,92,191,0.2);--border-gold:rgba(212,168,83,0.3);
  --shadow-purple:0 4px 20px rgba(124,92,191,0.15);
  --radius-sm:8px;--radius-md:14px;--radius-lg:20px;
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text-primary);-webkit-font-smoothing:antialiased}

.atmosphere{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.atmosphere::before{content:'';position:absolute;top:-20%;left:-10%;width:60%;height:60%;background:radial-gradient(ellipse,rgba(124,92,191,0.12)0%,transparent 70%);animation:drift1 20s ease-in-out infinite}
.atmosphere::after{content:'';position:absolute;bottom:-10%;right:-10%;width:50%;height:50%;background:radial-gradient(ellipse,rgba(74,127,212,0.1)0%,transparent 70%);animation:drift2 25s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5%,8%) scale(1.1)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5%,-6%) scale(1.15)}}
.spotlight{position:fixed;top:-30%;left:50%;transform:translateX(-50%);width:80%;height:60%;background:radial-gradient(ellipse at center top,rgba(212,168,83,0.06)0%,transparent 60%);pointer-events:none;z-index:0}
.music-notes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.note{position:absolute;font-size:1.2rem;opacity:0;color:var(--accent-gold);animation:floatNote linear infinite;filter:blur(0.5px)}
@keyframes floatNote{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:0.15}90%{opacity:0.15}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}

.app-shell{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;max-width:1400px;margin:0 auto}

.header{flex-shrink:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px 24px 12px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--border-gold),transparent)}
.header-title{font-family:'Noto Serif SC',serif;font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,var(--accent-gold),#f0d890,var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:0.08em}
.header-subtitle{font-size:0.78rem;color:var(--text-muted);margin-top:4px;letter-spacing:0.15em;font-weight:300}

.main-content{flex:1;display:flex;overflow:hidden;gap:0;padding:12px 16px;min-height:0}

.sidebar{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding-right:12px}
.sidebar-label{font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.2em;padding:4px 8px;font-weight:500}
.quick-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-glass);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-secondary);font-size:0.82rem;cursor:pointer;transition:all var(--transition);backdrop-filter:blur(8px);font-family:inherit;text-align:left;line-height:1.4}
.quick-btn:hover{background:var(--bg-card-hover);border-color:var(--accent-purple);color:var(--text-primary);transform:translateX(4px);box-shadow:var(--shadow-purple)}
.quick-btn:active{transform:translateX(2px) scale(0.98)}
.quick-btn .icon{font-size:1.3rem;flex-shrink:0}
.quick-btn .label{font-weight:500}
.sidebar-decor{margin-top:auto;position:relative;height:80px;opacity:0.15}
.sidebar-decor .line{position:absolute;left:0;right:0;height:1px;background:var(--accent-gold)}
.sidebar-decor .line:nth-child(1){top:20%}.sidebar-decor .line:nth-child(2){top:35%}.sidebar-decor .line:nth-child(3){top:50%}.sidebar-decor .line:nth-child(4){top:65%}.sidebar-decor .line:nth-child(5){top:80%}

.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--surface);backdrop-filter:blur(12px);overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.chat-messages::-webkit-scrollbar{width:5px}
.chat-messages::-webkit-scrollbar-track{background:transparent}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(124,92,191,0.25);border-radius:10px}

.welcome-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px;gap:16px;animation:fadeInUp 0.8s ease-out}
.welcome-icon{font-size:3.5rem;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.welcome-text{font-family:'Noto Serif SC',serif;font-size:1.1rem;color:var(--text-primary);line-height:1.8}
.welcome-hint{font-size:0.78rem;color:var(--text-muted)}

.msg-row{display:flex;gap:10px;animation:fadeInUp 0.4s ease-out;max-width:85%}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.msg-row.ai{align-self:flex-start}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.msg-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;margin-top:2px}
.msg-row.user .msg-avatar{background:var(--user-bubble)}
.msg-row.ai .msg-avatar{background:linear-gradient(135deg,var(--accent-gold-dim),var(--accent-gold))}

.msg-bubble{padding:12px 16px;border-radius:var(--radius-md);line-height:1.7;font-size:0.9rem;position:relative;word-break:break-word}
.msg-row.user .msg-bubble{background:var(--user-bubble);color:#fff;border-bottom-right-radius:4px}
.msg-row.ai .msg-bubble{background:var(--ai-bubble);border:1px solid var(--border-subtle);border-bottom-left-radius:4px;color:var(--text-primary)}

.typing-dots{display:inline-flex;gap:4px;align-items:center;padding:4px 0}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent-gold);animation:dotBounce 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}

.stream-cursor::after{content:'▎';color:var(--accent-gold);animation:blink 0.8s step-end infinite;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.input-area{flex-shrink:0;padding:12px 20px 16px;border-top:1px solid var(--border-subtle);display:flex;gap:10px;align-items:flex-end}
.input-wrapper{flex:1;position:relative}
.input-field{width:100%;padding:12px 16px;background:var(--bg-mid);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:0.9rem;font-family:inherit;resize:none;outline:none;transition:border-color var(--transition),box-shadow var(--transition);min-height:44px;max-height:120px;line-height:1.5}
.input-field::placeholder{color:var(--text-muted)}
.input-field:focus{border-color:var(--accent-purple);box-shadow:0 0 0 3px rgba(124,92,191,0.15)}

.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--user-bubble);color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition);flex-shrink:0}
.send-btn:hover{transform:scale(1.08);box-shadow:0 0 16px rgba(124,92,191,0.4)}
.send-btn:active{transform:scale(0.95)}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}

.status-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px;font-size:0.7rem;color:var(--text-muted)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted)}
.status-dot.online{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,0.5)}
.status-dot.thinking{background:var(--accent-gold);box-shadow:0 0 6px var(--accent-gold-glow);animation:pulse 1s infinite}

.msg-bubble p{margin:0.4em 0}
.msg-bubble strong{color:var(--accent-gold);font-weight:700}
.msg-bubble em{color:var(--accent-purple);font-style:italic}
.msg-bubble code{background:rgba(124,92,191,0.15);padding:1px 5px;border-radius:4px;font-size:0.85em}
.msg-bubble ul,.msg-bubble ol{padding-left:1.4em;margin:0.4em 0}
.msg-bubble li{margin:0.2em 0}
.msg-bubble.error{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.08);color:#fca5a5}

@media(max-width:768px){
  .sidebar{display:none}
  .header-title{font-size:1.2rem}
  .msg-row{max-width:95%}
}
</style>
</head>
<body>

<div class="atmosphere"></div>
<div class="spotlight"></div>
<div class="music-notes" id="musicNotes"></div>

<div class="app-shell">
  <header class="header">
    <div class="header-title">🎵 声韵 · 声乐AI教学助手</div>
    <div class="header-subtitle">大连艺术学院戏剧影视与传媒学院表演基础教研室出品</div>
  </header>

  <div class="main-content">
    <aside class="sidebar">
      <div class="sidebar-label">快捷功能</div>
      <button class="quick-btn" onclick="quickAsk('请帮我诊断一下我的气息问题，我唱歌时总觉得气不够用')">
        <span class="icon">🫁</span><span class="label">气息问题诊断</span>
      </button>
      <button class="quick-btn" onclick="quickAsk('请帮我解析一下这首曲目的风格特点和演唱要点')">
        <span class="icon">🎼</span><span class="label">曲目风格解析</span>
      </button>
      <button class="quick-btn" onclick="quickAsk('请给我制定一份课前热身方案，包括发声练习和身体放松')">
        <span class="icon">☀️</span><span class="label">课前热身方案</span>
      </button>
      <button class="quick-btn" onclick="quickAsk('请介绍一下常用的演唱技巧，以及如何练习')">
        <span class="icon">🎤</span><span class="label">演唱技巧速查</span>
      </button>
      <div class="sidebar-decor"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div>
    </aside>

    <div class="chat-area">
      <div class="chat-messages" id="chatMessages">
        <div class="welcome-card" id="welcomeCard">
          <div class="welcome-icon">🎭</div>
          <div class="welcome-text">欢迎使用<strong>声韵</strong>声乐AI教学助手<br>无论是气息控制、共鸣训练还是曲目解析<br>我都可以为你提供专业指导</div>
          <div class="welcome-hint">输入你的问题，或点击左侧快捷功能开始</div>
        </div>
      </div>
      <div class="status-bar">
        <span class="status-dot online" id="statusDot"></span>
        <span id="statusText">在线</span>
      </div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea class="input-field" id="inputField" placeholder="输入你的声乐问题..." rows="1" onkeydown="handleKeydown(event)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// Config & State
// ═══════════════════════════════════════════
const API_URL = 'https://yuanqi.tencent.com/openapi/v1/agent/chat/completions';
const APP_ID  = '2049083180719277120';
const APP_KEY = 'FKUeqc0uvYquY1enhkDxSMZHEh5igpV3';
const USER_ID = 'web_' + Math.random().toString(36).substr(2, 8);

let conversationHistory = []; // {role, content}
let isStreaming = false;

// ═══════════════════════════════════════════
// DOM References
// ═══════════════════════════════════════════
const chatMessages  = document.getElementById('chatMessages');
const inputField    = document.getElementById('inputField');
const sendBtn       = document.getElementById('sendBtn');
const welcomeCard   = document.getElementById('welcomeCard');
const statusDot     = document.getElementById('statusDot');
const statusText    = document.getElementById('statusText');

// ═══════════════════════════════════════════
// Music Notes Background
// ═══════════════════════════════════════════
(function initNotes() {
  const container = document.getElementById('musicNotes');
  const symbols = ['♩','♪','♫','♬','𝄞','𝄢'];
  for (let i = 0; i < 12; i++) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = symbols[i % symbols.length];
    n.style.left = (Math.random() * 100) + '%';
    n.style.animationDuration = (15 + Math.random() * 20) + 's';
    n.style.animationDelay = (Math.random() * 15) + 's';
    n.style.fontSize = (0.8 + Math.random() * 0.8) + 'rem';
    container.appendChild(n);
  }
})();

// ═══════════════════════════════════════════
// Auto-resize textarea
// ═══════════════════════════════════════════
inputField.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ═══════════════════════════════════════════
// Keyboard handler
// ═══════════════════════════════════════════
function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ═══════════════════════════════════════════
// Quick Ask
// ═══════════════════════════════════════════
function quickAsk(text) {
  inputField.value = text;
  inputField.style.height = 'auto';
  inputField.style.height = Math.min(inputField.scrollHeight, 120) + 'px';
  inputField.focus();
  sendMessage();
}

// ═══════════════════════════════════════════
// Render Helpers
// ═══════════════════════════════════════════
function scrollToBottom() {
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeWelcome() {
  if (welcomeCard) {
    welcomeCard.remove();
  }
}

function addMessage(role, content, isStreaming) {
  removeWelcome();
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? '👤' : '🎵';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble' + (isStreaming ? ' stream-cursor' : '');
  bubble.innerHTML = isStreaming ? '<div class="typing-dots"><span></span><span></span><span></span></div>' : formatContent(content);

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatMessages.appendChild(row);
  scrollToBottom();

  return bubble;
}

function formatContent(text) {
  // Simple markdown-ish: bold, italic, code, line breaks
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
  return html;
}

function setStatus(state) {
  statusDot.className = 'status-dot ' + state;
  if (state === 'online') statusText.textContent = '在线';
  else if (state === 'thinking') statusText.textContent = '声韵正在思考...';
}

// ═══════════════════════════════════════════
// Send Message
// ═══════════════════════════════════════════
async function sendMessage() {
  const text = inputField.value.trim();
  if (!text || isStreaming) return;

  // Show user message
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  // Clear input
  inputField.value = '';
  inputField.style.height = 'auto';

  // Disable while streaming
  isStreaming = true;
  sendBtn.disabled = true;
  setStatus('thinking');

  // Build messages for API (last 20 turns max)
  const apiMessages = conversationHistory.slice(-40).map(m => ({
    role: m.role,
    content: [{ type: 'text', text: m.content }]
  }));

  const requestBody = {
    assistant_id: APP_ID,
    user_id: USER_ID,
    stream: true,
    messages: apiMessages
  };

  // Add AI bubble with typing indicator
  const aiBubble = addMessage('ai', '', true);

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + APP_KEY
      },
      body: JSON.stringify(requestBody)
    });

    if (!response.ok) {
      throw new Error('API请求失败: ' + response.status + ' ' + response.statusText);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data: ')) continue;
        const data = trimmed.slice(6);
        if (data === '[DONE]') continue;

        try {
          const json = JSON.parse(data);
          const choice = json.choices && json.choices[0];
          if (!choice) continue;

          const delta = choice.delta;
          if (delta && delta.role === 'assistant' && delta.content) {
            fullContent += delta.content;
            aiBubble.classList.add('stream-cursor');
            aiBubble.innerHTML = formatContent(fullContent);
            scrollToBottom();
          }

          // Check finish
          if (choice.finish_reason === 'stop') {
            // Done
          }
        } catch (parseErr) {
          // Skip unparseable lines
        }
      }
    }

    // Finalize
    aiBubble.classList.remove('stream-cursor');
    if (!fullContent) {
      aiBubble.innerHTML = '<em>（未收到回复）</em>';
    } else {
      aiBubble.innerHTML = formatContent(fullContent);
      conversationHistory.push({ role: 'assistant', content: fullContent });
    }

  } catch (err) {
    aiBubble.classList.remove('stream-cursor');
    aiBubble.className = 'msg-bubble error';
    aiBubble.textContent = '⚠️ ' + err.message;
    console.error('API Error:', err);
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    setStatus('online');
    scrollToBottom();
  }
}
</script>
</body>
</html>
